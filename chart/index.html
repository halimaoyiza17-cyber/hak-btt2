  },

  timeTag(x, time, color) {
    const text = displayBarTime(time);
    ctx.font="11px -apple-system,Segoe UI,Arial,sans-serif"; const tw=ctx.measureText(text).width+10;
    const left=Math.max(0,Math.min(canvas.clientWidth-tw,x-tw/2)), y=canvas.clientHeight-19;
    ctx.fillStyle=color; ctx.fillRect(left,y,tw,18); ctx.fillStyle="#fff"; ctx.fillText(text,left+5,y+13);
  },

  drawReplayGuide(time) {
    const x=Coords.timeToX(time); if(x==null)return;
    ctx.save(); ctx.strokeStyle="#f59e0b"; ctx.lineWidth=1.5; ctx.setLineDash([5,4]); ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.clientHeight);ctx.stroke();
    this.timeTag(x,time,"#f59e0b"); ctx.restore();
  },

  priceTag(y, price, color) {
    const text = formatPrice(price);
    ctx.font = "11px -apple-system,Segoe UI,Arial,sans-serif";
    const tw = ctx.measureText(text).width + 10;
    ctx.fillStyle = color;
    ctx.fillRect(canvas.clientWidth - tw - 2, y - 9, tw, 18);
    ctx.fillStyle = "#fff";
    ctx.fillText(text, canvas.clientWidth - tw + 3, y + 4);
  },
};

function hexRgba(hex, a) {
  const h = (hex || "#2962ff").replace("#", "");
  return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
}

// ═══════════════════════════════════════════════════════════
//  HIT TEST
// ═══════════════════════════════════════════════════════════
const HitTest = {
  handles(s) {
    const out = [];
    if (s.type === "trend") {
      const a = Coords.pointToScreen(s.points[0]);
      const b = Coords.pointToScreen(s.points[1]);
      out.push({ name: "p0", x: a.x, y: a.y });
      out.push({ name: "p1", x: b.x, y: b.y });
    } else if (s.type === "rect") {
      const a = Coords.pointToScreen(s.points[0]), b = Coords.pointToScreen(s.points[1]);
      if ([a.x,a.y,b.x,b.y].some(v=>v==null)) return out;
      const l=Math.min(a.x,b.x), r=Math.max(a.x,b.x), t=Math.min(a.y,b.y), bt=Math.max(a.y,b.y), mx=(l+r)/2, my=(t+bt)/2;
      out.push({name:"nw",x:l,y:t},{name:"n",x:mx,y:t},{name:"ne",x:r,y:t},{name:"e",x:r,y:my},{name:"se",x:r,y:bt},{name:"s",x:mx,y:bt},{name:"sw",x:l,y:bt},{name:"w",x:l,y:my});
    } else if (s.type === "hline") {
      out.push({ name: "price", x: canvas.clientWidth / 2, y: Coords.priceToY(s.points[0].price) });
    } else if (s.type === "hray") {
      const p = Coords.pointToScreen(s.points[0]);
      out.push({ name: "origin", x: p.x, y: p.y });
    } else if (s.type === "vline") {
      out.push({ name: "time", x: Coords.timeToX(s.points[0].time), y: canvas.clientHeight / 2 });
    } else if (s.type === "text") {
      const p = Coords.pointToScreen(s.points[0]);
      out.push({ name: "anchor", x: p.x, y: p.y });
    } else if (s.type === "long" || s.type === "short") {
      if (s.endTime == null && s.points && s.points[0]) {
        const barSecs = Coords.barSecs();
        s.endTime = s.points[0].time + barSecs * 30;
      }
      const x0 = Coords.positionXAtTime(s.points[0].time);
      const x1 = s.endTime != null ? Coords.positionXAtTime(s.endTime) : null;
      if (x0 == null || x1 == null) return out;
      const left = Math.min(x0, x1);
      const right = Math.max(x0, x1);
      out.push({ name: "entry", x: left, y: Coords.priceToY(s.entry) });
      out.push({ name: "tp", x: left, y: Coords.priceToY(s.tp) });
      out.push({ name: "sl", x: left, y: Coords.priceToY(s.sl) });
      out.push({ name: "width", x: right, y: Coords.priceToY(s.entry) });
    } else if (s.type === "fib") {
      const a = Coords.pointToScreen(s.points[0]);
      const b = Coords.pointToScreen(s.points[1]);
      out.push({ name: "p0", x: a.x, y: a.y });
      out.push({ name: "p1", x: b.x, y: b.y });
    }
    return out;
  },

  at(sx, sy) {
    const R = 8;
    // handles first (topmost)
    for (let i = Store.items.length - 1; i >= 0; i--) {
      const s = Store.items[i];
      if (!s.visible) continue;
      for (const h of this.handles(s)) {
        if (h.x != null && h.y != null && Math.hypot(sx - h.x, sy - h.y) <= R) {
          return { shape: s, kind: "handle", handle: h.name };
        }
      }
    }
    // body
    for (let i = Store.items.length - 1; i >= 0; i--) {
      const s = Store.items[i];
      if (!s.visible) continue;
      if (this.body(s, sx, sy, R)) return { shape: s, kind: "body" };
    }
    return null;
  },

  body(s, sx, sy, R) {
    if (s.type === "trend") {
      const a = Coords.pointToScreen(s.points[0]);
      const b = Coords.pointToScreen(s.points[1]);
      if ([a.x, a.y, b.x, b.y].some(v => v == null)) return false;
      return distSeg(sx, sy, a.x, a.y, b.x, b.y) <= R;
    }
    if (s.type === "hline") {
      const y = Coords.priceToY(s.points[0].price);
      return y != null && Math.abs(sy - y) <= R;
    }
    if (s.type === "hray") {
      const p = Coords.pointToScreen(s.points[0]);
      return p.x != null && p.y != null && sx >= p.x - R && Math.abs(sy - p.y) <= R;
    }
    if (s.type === "vline") {
      const x = Coords.timeToX(s.points[0].time);
      return x != null && Math.abs(sx - x) <= R;
    }
    if (s.type === "rect") {
      const a = Coords.pointToScreen(s.points[0]);
      const b = Coords.pointToScreen(s.points[1]);
      if ([a.x, a.y, b.x, b.y].some(v => v == null)) return false;
      const rx = Math.min(a.x, b.x), ry = Math.min(a.y, b.y);
      const rw = Math.abs(b.x - a.x), rh = Math.abs(b.y - a.y);
      return sx >= rx - R && sx <= rx + rw + R && sy >= ry - R && sy <= ry + rh + R;
    }
    if (s.type === "text") {
      const p = Coords.pointToScreen(s.points[0]);
      return p.x != null && p.y != null && Math.hypot(sx - p.x, sy - p.y) <= 16;
    }
    if (s.type === "long" || s.type === "short") {
      if (s.endTime == null && s.points && s.points[0]) {
        const barSecs = Coords.barSecs();
        s.endTime = s.points[0].time + barSecs * 30;
      }
      const x0 = Coords.positionXAtTime(s.points[0].time);
      const x1 = s.endTime != null ? Coords.positionXAtTime(s.endTime) : null;
      const yE = Coords.priceToY(s.entry), yT = Coords.priceToY(s.tp), yS = Coords.priceToY(s.sl);
      if (x0 == null || x1 == null || yE == null) return false;
      const left = Math.min(x0, x1);
      const right = Math.max(x0, x1);
      const top = Math.min(yE, yT ?? yE, yS ?? yE);
      const bot = Math.max(yE, yT ?? yE, yS ?? yE);
      return sx >= left - R && sx <= right + R && sy >= top - R && sy <= bot + R;
    }
    if (s.type === "fib") {
      const a = Coords.pointToScreen(s.points[0]);
      const b = Coords.pointToScreen(s.points[1]);
      if ([a.x, a.y, b.x, b.y].some(v => v == null)) return false;
      // Hit near 0, 50, or 100 horizontal rays across the fib span
      const y0 = a.y, y1 = b.y, yMid = (y0 + y1) / 2;
      const xL = Math.min(a.x, b.x), xR = Math.max(a.x, b.x);
      if (sx < xL - R || sx > xR + R) return false;
      return Math.abs(sy - y0) <= R || Math.abs(sy - y1) <= R || Math.abs(sy - yMid) <= R;
    }
    return false;
  },
};

function distSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

const ReplayPicker = {
  active:false, hoverTime:null,
  start() {
    if (replayNamespace(app.wlSection) !== "pairs" && !String(app.wlSection).startsWith("obs:")) { showHint("Select on chart is available in Pairs only"); return; }
    this.active=true; this.hoverTime=app.fullData[Math.max(0,app.fullData.length-1)]?.time ?? null;
    document.getElementById("chartArea").classList.add("tool-active");
    document.getElementById('replayPickerControls').hidden=!matchMedia('(pointer:coarse)').matches;
    Interaction._pan(false);
    showHint(matchMedia('(pointer:coarse)').matches?'Drag the dashed guide, then tap Start here':'Move to a candle and click to start replay · Esc to cancel'); Renderer.render();
  },
  move(x) { if(!this.active)return; this.hoverTime=Coords.snapTime(Coords.xToTime(x)); Renderer.render(); },
  commit() { if(!this.active||this.hoverTime==null)return; const t=this.hoverTime; this.cancel(); startReplayAt(t, {exactCandle:true}); },
  cancel() { this.active=false; this.hoverTime=null; this.touchId=null; document.getElementById('replayPickerControls').hidden=true; Interaction._pan(true); document.getElementById("chartArea").classList.toggle("tool-active",Interaction.tool!=="cursor"); showHint(""); Renderer.render(); },
};

// ═══════════════════════════════════════════════════════════
//  INTERACTION — tools, drag, keyboard
// ═══════════════════════════════════════════════════════════
const Interaction = {
  tool: "cursor",
  mode: "idle", // idle | toolSelected | drawing | selected | dragging
  draft: null,
  drag: null, // {kind, id, handle?, startX, startY, originChart, snapshot}

  setTool(tool) {
    LOG("tool:", tool);
    this.tool = tool;
    if(tool==='cursor')document.getElementById('templateChip')?.remove();
    this.mode = tool === "cursor" ? "idle" : "toolSelected";
    this.draft = null;
    this.drag = null;
    document.querySelectorAll(".draw-btn[data-tool]").forEach(b => {
      b.classList.toggle("active", b.dataset.tool === tool);
    });
    document.getElementById("chartArea").classList.toggle("tool-active", tool !== "cursor");
    this._pan(true);
    showHint(tool === "cursor" ? "" : `Click chart to place ${tool}`);
    Renderer.render();
  },

  _pan(on) {
    if (app.chart) app.chart.applyOptions({ handleScroll: on, handleScale: on });
  },

  _pos(e) {
    const r = document.getElementById("chartArea").getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  },

  pointerDown(e) {
    // Taps on the style/color panel must not reach the chart (would close the panel)
    if (e.target && e.target.closest && e.target.closest("#settingsPopup, #objectTree, #replayPickerControls, #templateChip, #styleChip")) return;
    const templatePanel=document.getElementById('settingsPopup');
    if(templatePanel?.classList.contains('template-list'))closeStylePanel();
    document.getElementById("objectTree").classList.remove("visible");
    document.getElementById("btnObjects").classList.remove("active");
    if (!app.fullData.length) { showHint("No data loaded"); return; }
    const { x, y } = this._pos(e);
    if (ReplayPicker.active) {
      ReplayPicker.move(x);
      if(e.pointerType==='touch'){ReplayPicker.touchId=e.pointerId;document.getElementById('replayPickerControls').hidden=false;try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}}
      else ReplayPicker.commit();
      e.preventDefault(); e.stopPropagation(); return;
    }
    const pt = Coords.screenToPoint(x, y);
    LOG("down", this.tool, this.mode, { x: Math.round(x), y: Math.round(y), t: pt.time, p: pt.price });

    // Select / start drag existing
    if (this.tool === "cursor" || this.mode === "selected" || this.mode === "idle") {
      const hit = HitTest.at(x, y);
      if (hit) {
        Store.select(hit.shape.id);
        this.mode = "dragging";
        const snap = JSON.parse(JSON.stringify(hit.shape));
        this.drag = {
          kind: hit.kind,
          id: hit.shape.id,
          handle: hit.handle || null,
          startX: x, startY: y,
          originChart: { time: pt.time, price: pt.price },
          snapshot: snap,
          moved: false,
        };
        this._pan(false);
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
        Renderer.render();
        e.preventDefault(); e.stopPropagation();
        return;
      } else if (this.tool === "cursor") {
        Store.deselect();
        this.mode = "idle";
        closeStylePanel();
        Renderer.render();
        return; // allow chart pan
      }
    }

    // Place new shape
    if (this.tool !== "cursor") {
      this._place(pt, x, y, e);
    }
  },

  _place(pt, x, y, e) {
    // Always resolve time/price — including empty areas with no candles
    let time = pt.time;
    let price = pt.price;
    if ((time == null || price == null) && app.fullData.length) {
      const again = Coords.screenToPoint(x, y);
      time = time ?? again.time;
      price = price ?? again.price;
    }
    if (time == null && app.fullData.length) time = app.fullData[app.fullData.length - 1].time;
    if (price == null && app.fullData.length) price = app.fullData[app.fullData.length - 1].close;

    if (this.tool === "hline" && price != null) {
      Store.add({ type: "hline", points: [{ time: time ?? app.fullData[0].time, price }] });
      this.setTool("cursor");
      e.preventDefault(); e.stopPropagation(); return;
    }
    if (this.tool === "vline" && time != null) {
      time = Coords.snapTime(time);
      Store.add({ type: "vline", points: [{ time, price: price ?? app.fullData[0].close }] });
      this.setTool("cursor");
      e.preventDefault(); e.stopPropagation(); return;
    }
    if (time == null || price == null) {
      showHint("No data loaded");
      return;
    }
    if (this.tool === "hray") {
      Store.add({ type: "hray", points: [{ time, price }] });
      this.setTool("cursor");
      e.preventDefault(); e.stopPropagation(); return;
    }
    if (this.tool === "text") {
      const txt = prompt("Enter text:", "Text");
      if (txt) Store.add({ type: "text", points: [{ time, price }], text: txt });
      this.setTool("cursor");
      e.preventDefault(); e.stopPropagation(); return;
    }
    if (this.tool === "long" || this.tool === "short") {
      // Choose an initial on-screen size once, then store time/price anchors.
      // A fixed 30-bar / percentage box could fill the whole view when zoomed.
      const area=document.getElementById('chartArea');
      const plotW=Math.max(1,area.clientWidth-65),plotH=Math.max(1,area.clientHeight-28);
      if(x<0 || x>plotW || y<0 || y>plotH) return;
      const width=Math.max(8,Math.min(160,plotW*.28,plotW-x));
      const tick=10**-pricePrecisionForSymbol(app.symbol);
      const unit=Math.abs((Coords.yToPrice(Math.min(plotH,y+1))??price)-price)||tick;
      const risk= Math.max(tick,unit*Math.min(38,plotH*.10));
      const reward= Math.max(tick,unit*Math.min(65,plotH*.17));
      const dir=this.tool==='long'?1:-1;
      const entry=price,sl=entry-dir*risk,tp=entry+dir*reward;
      const startTime=Coords.positionTimeAtX(x),rightTime=Coords.positionTimeAtX(x+width);
      const startX=Coords.positionXAtTime(startTime);
      if(!Number.isFinite(startTime)||!Number.isFinite(rightTime)||!Number.isFinite(startX)||Math.abs(startX-x)>3){
        showHint('Could not place the position at that point; tap the entry again');return;
      }
      Store.add({
        type:this.tool,points:[{time:startTime,price}],entry,sl,tp,
        endTime:rightTime>startTime?rightTime:startTime+Coords.barSecs(),
        position:{startBarTime:startTime>(app.renderedBars.at(-1)?.time??-Infinity)?startTime:(app.renderedBars.findLast(b=>b.time<=startTime)?.time??startTime)},
      });
      this.setTool("cursor");
      e.preventDefault(); e.stopPropagation(); return;
    }
    if (this.tool === "trend" || this.tool === "fib") {
      if (!this.draft) {
        this.draft = { type: this.tool, points: [{ time, price }] };
        this.mode = "drawing";
        this._pan(false);
        showHint(this.tool === "fib" ? "Tap 100% end (0 → 50 → 100)" : "Click second point");
        Renderer.render();
      } else {
        Store.add({ type: this.tool, points: [this.draft.points[0], { time, price }] });
        this.draft = null;
        this.setTool("cursor");
      }
      e.preventDefault(); e.stopPropagation(); return;
    }
    if (this.tool === "rect" || this.tool === "observation") {
      if (!this.draft) {
        this.draft = { type: "rect", points: [{ time, price }, { time, price }], dragging: true };
        this.mode = "drawing";
        this._pan(false);
        showHint("Drag to opposite corner, release to finish");
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
        Renderer.render();
      }
      e.preventDefault(); e.stopPropagation(); return;
    }
  },

  pointerMove(e) {
    if (e.target && e.target.closest && e.target.closest("#settingsPopup, #objectTree")) return;
    const { x, y } = this._pos(e);
    if (ReplayPicker.active) { ReplayPicker.move(x); e.preventDefault(); e.stopPropagation(); return; }
    const pt = Coords.screenToPoint(x, y);

    // Drag shape
    if (this.drag && this.mode === "dragging") {
      const s = Store.get(this.drag.id);
      if (!s || pt.time == null || pt.price == null) return;
      // Locked shapes: select/delete only — no move/resize until unlocked in options
      if (s.locked) {
        e.preventDefault(); e.stopPropagation();
        return;
      }
      const snap = this.drag.snapshot;
      const oc = this.drag.originChart;
      if (oc.time == null || oc.price == null) return;
      // Handles: any movement counts immediately (same feel as long/short dots)
      // Body: small threshold so a pure tap still counts as tap
      if (this.drag.kind === "handle") {
        if (x !== this.drag.startX || y !== this.drag.startY) this.drag.moved = true;
      } else if (Math.hypot(x - this.drag.startX, y - this.drag.startY) > 3) {
        this.drag.moved = true;
      }

      if (this.drag.kind === "handle") {
        this._dragHandle(s, this.drag.handle, pt);
      } else {
        const dT = pt.time - oc.time;
        const dP = pt.price - oc.price;
        this._dragBody(s, snap, dT, dP);
      }
      Renderer.render(); // sync — no rAF
      e.preventDefault(); e.stopPropagation();
      return;
    }

    // Draft preview
    if (this.draft && this.mode === "drawing") {
      if (pt.time != null && pt.price != null) {
        if (this.draft.type === "trend" || this.draft.type === "fib") this.draft.preview = { time: pt.time, price: pt.price };
        else if (this.draft.type === "rect" && this.draft.dragging) {
          this.draft.points[1] = { time: pt.time, price: pt.price };
        }
        Renderer.render();
      }
      e.preventDefault(); e.stopPropagation();
    }
  },

  _dragHandle(s, handle, pt) {
    const { time, price } = pt;
    if (s.type === "trend") {
      if (s.straight) {
        // Horizontal lock: only time moves, both ends keep same price
        const p = handle === "p0" ? (s.points[1]?.price ?? price) : (s.points[0]?.price ?? price);
        if (handle === "p0") s.points[0] = { time, price: p };
        else s.points[1] = { time, price: p };
        // Keep other end at same price
        if (handle === "p0" && s.points[1]) s.points[1].price = p;
        if (handle === "p1" && s.points[0]) s.points[0].price = p;
      } else {
        if (handle === "p0") s.points[0] = { time, price };
        else s.points[1] = { time, price };
      }
    } else if (s.type === "rect") {
      const snap = this.drag?.snapshot || s;
      let left=Math.min(snap.points[0].time,snap.points[1].time), right=Math.max(snap.points[0].time,snap.points[1].time);
      let high=Math.max(snap.points[0].price,snap.points[1].price), low=Math.min(snap.points[0].price,snap.points[1].price);
      if (handle.includes("w")) left=time;
      if (handle.includes("e")) right=time;
      if (handle === "n" || handle.includes("n")) high=price;
      if (handle === "s" || handle.includes("s")) low=price;
      const t0=Math.min(left,right), t1=Math.max(left,right), pHi=Math.max(high,low), pLo=Math.min(high,low);
      s.points[0]={time:t0,price:pHi}; s.points[1]={time:t1,price:pLo};
    } else if (s.type === "fib") {
      if (handle === "p0") s.points[0] = { time, price };
      else s.points[1] = { time, price };
    } else if (s.type === "hline") {
      s.points[0].price = price;
    } else if (s.type === "hray") {
      s.points[0] = { time, price };
    } else if (s.type === "vline") {
      s.points[0].time = Coords.snapTime(time);
    } else if (s.type === "text") {
      s.points[0] = { time, price };
    } else if (s.type === "long" || s.type === "short") {
      if (handle === "entry") {
        const dtp = s.tp - s.entry, dsl = s.sl - s.entry;
        s.entry = price; s.tp = price + dtp; s.sl = price + dsl;
        s.points[0].price = price;
      } else if (handle === "tp") {
        const tick=10**-pricePrecisionForSymbol(app.symbol);
        s.tp=s.type==='long'?Math.max(s.entry+tick,price):Math.min(s.entry-tick,price);
      } else if (handle === "sl") {
        const tick=10**-pricePrecisionForSymbol(app.symbol);
        s.sl=s.type==='long'?Math.min(s.entry-tick,price):Math.max(s.entry+tick,price);
      }
      else if (handle === "width") s.endTime = Math.max(s.points[0].time, time);
    }
  },

  _dragBody(s, snap, dT, dP) {
    if (s.type === "trend" || s.type === "rect" || s.type === "fib") {
      s.points[0] = { time: snap.points[0].time + dT, price: snap.points[0].price + dP };
      s.points[1] = { time: snap.points[1].time + dT, price: snap.points[1].price + dP };
    } else if (s.type === "hline") {
      s.points[0].price = snap.points[0].price + dP;
    } else if (s.type === "vline") {
      s.points[0] = { time: Coords.snapTime(snap.points[0].time + dT), price: (snap.points[0].price || 0) + dP };
    } else if (s.type === "hray" || s.type === "text") {
      s.points[0] = {
        time: snap.points[0].time + dT,
        price: (snap.points[0].price || 0) + dP,
      };
    } else if (s.type === "long" || s.type === "short") {
      s.points[0].time = snap.points[0].time + dT;
      if (snap.endTime != null) s.endTime = snap.endTime + dT;
      s.entry = snap.entry + dP;
      s.tp = snap.tp + dP;
      s.sl = snap.sl + dP;
    }
  },

  pointerUp(e) {
    if (ReplayPicker.active && ReplayPicker.touchId===e.pointerId){ReplayPicker.touchId=null;e.preventDefault();e.stopPropagation();return;}
    if (e.target && e.target.closest && e.target.closest("#settingsPopup, #objectTree, #replayPickerControls, #templateChip, #styleChip")) return;
    if (this.drag) {
      const wasTap = !this.drag.moved;
      const id = this.drag.id;
      this.drag = null;
      this.mode = "selected";
      this._pan(true);
      Store.save(); // persist move/resize
      Renderer.render();
      if (wasTap) {
        const shape = Store.get(id);
        if (shape && !Observations.tap(shape)) openStylePanel(shape);
      }
    } else if (this.tool === "cursor" && !this.draft) {
      // Triple-tap vertical week marker → style panel
      const { x } = this._pos(e);
      const which = WeekMarkers.hit(x);
      if (which) WeekMarkers.registerTap(which);
    }
    if (this.draft && this.draft.type === "rect" && this.draft.dragging) {
      this.draft.dragging = false;
      if(this.tool === "observation") Observations.create(this.draft.points);
      else Store.add({ type: "rect", points: [this.draft.points[0], this.draft.points[1]] });
      this.draft = null;
      this.setTool("cursor");
    }
  },
};

// Native chart crosshair is refreshed explicitly because drawing drags consume
// pointer events before the chart library receives them.
const CursorUI = {
  mode: localStorage.getItem('btt2_cursor_v1') === 'dot' ? 'dot' : 'cross',
  apply(mode) {
    this.mode = mode === 'dot' ? 'dot' : 'cross';
    localStorage.setItem('btt2_cursor_v1',this.mode);
    document.getElementById('chartArea').classList.toggle('dot-cursor',this.mode==='dot');
    document.querySelector('[data-tool="cursor"]').textContent=this.mode==='dot'?'•':'✙';
    document.querySelectorAll('[data-cursor]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cursor===this.mode)));
    Renderer.render();
  },
  guide(e) {
    if(e.target.closest?.('#settingsPopup, #objectTree')) return;
    const {x,y}=Interaction._pos(e), pt=Coords.screenToPoint(x,y);
    if(pt.time!=null && pt.price!=null && app.chart?.setCrosshairPosition)
      app.chart.setCrosshairPosition(pt.price,Coords.snapTime(pt.time),activePriceSeries());
  }
};
document.getElementById('chartArea').classList.toggle('dot-cursor',CursorUI.mode==='dot');
document.querySelector('[data-tool="cursor"]').textContent=CursorUI.mode==='dot'?'•':'✙';
const cursorMenu=document.getElementById('cursorMenu');

document.addEventListener('pointerdown',e=>{if(!e.target.closest('.cursor-picker, #cursorMenu')){cursorMenu.hidden=true;document.getElementById('cursorArrow').setAttribute('aria-expanded','false');}});
// Wire interaction to chart area (capture phase)

function showHint(msg) {
  const el = document.getElementById("statusHint");
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
}

function esc(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]); }
function popupEvents(panel) {
  // Bubble-phase only: controls receive their click/input first, then the event
  // stops before reaching chart navigation. Capture-phase blocking made every
  // Save/Delete/Done/Close button appear clickable while doing nothing.
  ["pointerdown","pointermove","pointerup","click","touchstart","touchend","wheel"].forEach(ev => panel.addEventListener(ev,e=>e.stopPropagation(),false));
}
function positionPopup(panel, s, anchor) {
  const area=document.getElementById("chartArea");
  if(s)panel._popupShape=s;if(anchor)panel._popupAnchor=anchor;
  s=s||panel._popupShape||null;anchor=anchor||panel._popupAnchor||null;
  if (!area || !panel) return;
  const pad=8,gap=10,aw=area.clientWidth,ah=area.clientHeight;
  let b=s ? Renderer.shapeBounds(s) : null;
  if(!b && anchor){
    const ar=anchor.getBoundingClientRect(),cr=area.getBoundingClientRect();
    b={left:ar.left-cr.left,right:ar.right-cr.left,top:ar.top-cr.top,bottom:ar.bottom-cr.top};
  }
  if(!b)b={left:pad,right:pad,top:pad,bottom:pad};
  panel.style.maxHeight="";
  if(aw<=600 && s){
    const above=Math.max(0,b.top-pad-gap),below=Math.max(0,ah-b.bottom-pad-gap);
    panel.style.maxHeight=Math.max(150,Math.max(above,below))+"px";
  }
  const pw=panel.offsetWidth,ph=panel.offsetHeight;
  const cx=(b.left+b.right)/2,cy=(b.top+b.bottom)/2;
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const raw=[
    {x:b.right+gap,y:cy-ph/2,name:"right"},{x:b.left-pw-gap,y:cy-ph/2,name:"left"},
    {x:cx-pw/2,y:b.bottom+gap,name:"below"},{x:cx-pw/2,y:b.top-ph-gap,name:"above"},
    {x:cx<aw/2?aw-pw-pad:pad,y:pad,name:"top-edge"},
    {x:cx<aw/2?aw-pw-pad:pad,y:ah-ph-pad,name:"bottom-edge"},
  ];
  const overlap=(r,q)=>Math.max(0,Math.min(r.x+r.w,q.right)-Math.max(r.x,q.left))*Math.max(0,Math.min(r.y+r.h,q.bottom)-Math.max(r.y,q.top));
  const candidates=raw.map(c=>{const x=clamp(c.x,pad,Math.max(pad,aw-pw-pad)),y=clamp(c.y,pad,Math.max(pad,ah-ph-pad));return{...c,x,y,score:overlap({x,y,w:pw,h:ph},b)*1000+Math.abs(x-c.x)+Math.abs(y-c.y)};});
  candidates.sort((a,b)=>a.score-b.score);
  const best=candidates[0];
  panel.dataset.placement=best.name;
  panel.style.right="auto";panel.style.bottom="auto";panel.style.left=Math.round(best.x)+"px";panel.style.top=Math.round(best.y)+"px";

function parseCsvText(text, sourceName) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim().length > 0);
  if (lines.length < 2) throw new Error("CSV has no data rows: " + sourceName);
  const first = lines[0];
  let sep = ",";
  if ((first.match(/;/g) || []).length > (first.match(/,/g) || []).length) sep = ";";
  const header = first.split(sep).map(h => h.trim().toLowerCase().replace(/^"|"$/g, ""));
  const findCol = (...names) => {
    for (const n of names) {
      const i = header.findIndex(h => h === n);
      if (i >= 0) return i;
    }
    return -1;
  };
  // UTC is authoritative; adapt once to the existing drawing/replay coordinate convention.
  const idx = {
    nigeria: findCol("datetime_nigeria"),
    time: findCol("time", "timestamp"),
    utc: findCol("datetime_utc"),
    open: findCol("open", "o"), high: findCol("high", "h"),
    low: findCol("low", "l"), close: findCol("close", "c", "price"),
  };
  if ([idx.open, idx.high, idx.low, idx.close].some(i => i < 0)) {
    throw new Error("Missing OHLC columns in " + sourceName + "\nFound: " + header.join(" | "));
  }
  if (idx.nigeria < 0 && idx.time < 0 && idx.utc < 0) {
    throw new Error("No time column in " + sourceName + "\nFound: " + header.join(" | "));
  }

  // Parse "YYYY-MM-DD HH:mm" as if UTC so axis labels match that clock
  function parseClockAsUtc(str) {
    const m = String(str).match(/(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})/);
    if (!m) return null;
    return Math.floor(Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]) / 1000);
  }

  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(sep).map(c => c.trim().replace(/^"|"$/g, ""));
    if (cols.length < 4) continue;
    let t = null;
    // All internal coordinates retain the legacy UTC+1 scale so saved drawings
    // and replay checkpoints remain attached to their original candles.
    if (idx.time >= 0 && cols[idx.time]) {
      const raw = cols[idx.time];
      if (/^\d{10}(?:\.\d+)?$/.test(raw)) t = Math.floor(+raw) + BttTime.OFFSET;
      else if (/^\d{12,13}$/.test(raw)) t = Math.floor(+raw / 1000) + BttTime.OFFSET;
    }
    if (t == null && idx.utc >= 0 && cols[idx.utc]) {
      const parsed = parseClockAsUtc(cols[idx.utc]);
      if (parsed != null) t = parsed + BttTime.OFFSET;
    }
    if (t == null && idx.nigeria >= 0 && cols[idx.nigeria]) t = parseClockAsUtc(cols[idx.nigeria]);
    if (t == null || !Number.isFinite(t)) continue;
    const o = +cols[idx.open], h = +cols[idx.high], l = +cols[idx.low], c = +cols[idx.close];
    if ([o, h, l, c].some(v => !Number.isFinite(v))) continue;
    rows.push({ time: t, open: o, high: h, low: l, close: c });
  }
  rows.sort((a, b) => a.time - b.time);
  const deduped = [];
  for (const r of rows) {
    if (deduped.length && deduped[deduped.length - 1].time === r.time) deduped[deduped.length - 1] = r;
    else deduped.push(r);
  }
  if (deduped.length < 2) throw new Error("Not enough valid rows in " + sourceName);
  LOG("parse", sourceName, "bars", deduped.length, "time source:", "UTC normalized to existing coordinates; display timezone separate");
  return deduped;
}

async function discoverDataFiles() {
  const generation = app.dataGeneration || 0;
  try {
    let html = "";
    try {
      const mRes = await fetch("../data/index.json", { cache: "no-store" });
      if (mRes.ok) {
        const list = await mRes.json();
        if (Array.isArray(list)) html = list.map(n => `href="${n}"`).join("\n");
      }
    } catch (_) {}
    if (!html) {
      const res = await fetch("../data/", { cache: "no-store" });
      if (!res.ok) { LOG("discover /data/ status", res.status); return; }
      html = await res.text();
    }
    if (generation !== (app.dataGeneration || 0)) return;
    // Match any .csv href in the directory listing
    const re = /href="([^"]+\.csv)"/gi;
    let m;
    const foundPairs = new Set();
    const tfPat = "15m|30m|1h|4h|1d|1w|1mo";
    // Symbol may include underscores (JUMP_10_INDEX, VOLATILITY_75_1S_INDEX)
    const symPat = "[A-Za-z0-9_]+";
    // Exchange / source in the filename (FOREXCOM, BINANCE, CRYPTO, DERIV, …)
    const exchPat = "[A-Za-z0-9]+";
    while ((m = re.exec(html)) !== null) {
      let name = decodeURIComponent(m[1].split("/").pop());
      // Patterns (in priority order):
      //   15m-extended-FOREXCOM-EURUSD.csv
      //   15m-extended-BINANCE-BNBUSDT.csv
      //   15m-extended-CRYPTO-BTCUSD.csv
      //   15m-extended-DERIV-JUMP_10_INDEX.csv
      //   15m-FOREXCOM-EURUSD.csv
      //   15m-extended-EURUSD.csv
      //   EURUSD_15m.csv  /  15m_EURUSD.csv
      let match =
        name.match(new RegExp(`^(${tfPat})-extended-(${exchPat})-(${symPat})\\.csv$`, "i")) ||
        name.match(new RegExp(`^(${tfPat})-(${exchPat})-(${symPat})\\.csv$`, "i")) ||
        name.match(new RegExp(`^(${tfPat})-extended-(${symPat})\\.csv$`, "i")) ||
        name.match(new RegExp(`^(${symPat})[_-](${tfPat})\\.csv$`, "i")) ||
        name.match(new RegExp(`^(${tfPat})[_-](${symPat})\\.csv$`, "i"));
      if (!match) {
        LOG("unrecognized csv name:", name);
        continue;
      }
      let tfKey, symbol;
      // match[1] is always TF when pattern starts with TF
      if (/^(15m|30m|1h|4h|1d|1w|1mo)$/i.test(match[1])) {
        tfKey = match[1].toLowerCase();
        // 3-group: TF-extended-EXCHANGE-SYMBOL  or  TF-EXCHANGE-SYMBOL
        // 2-group: TF-extended-SYMBOL  or  TF_SYMBOL
        symbol = (match[3] || match[2]).toUpperCase();
      } else {
        // SYMBOL_TF
        symbol = match[1].toUpperCase();
        tfKey = match[2].toLowerCase();
      }
      availableFiles[symbol + "_" + tfKey] = name;
      foundPairs.add(symbol);
    }
    for (const p of foundPairs) if (!PAIRS.includes(p)) PAIRS.push(p);
    // Keep the existing shared array current for watchlist/backtest consumers.
    OTHER_PAIRS.splice(0, OTHER_PAIRS.length, ...PAIRS.filter(p => !FOREX_PAIRS.includes(p)));
    LOG("discovered", Object.keys(availableFiles).length, "files,", foundPairs.size, "pairs", [...foundPairs]);
  } catch (e) { LOG("discover failed", e.message); }
}

// Calendar-quarter candles, using the feed's trading date (not 90-day blocks).
function aggregateQuarters(rows, forex) {
  const out = [];
  for (const b of rows) {
    const d = new Date(BttTime.dateStamp(b.time, '1d', forex, 'UTC') * 1000);
    const quarter = d.getUTCFullYear() * 4 + Math.floor(d.getUTCMonth() / 3);
    let q = out[out.length - 1];
    if (!q || q.quarter !== quarter) out.push({...b, quarter});
    else { q.high = Math.max(q.high, b.high); q.low = Math.min(q.low, b.low); q.close = b.close; }
  }
  return out.map(({quarter, ...bar}) => bar);
}
async function loadCsv(symbol, tfKey, opts) {
  const key = symbol + "_" + tfKey;
  if (app.cache[key] && (!opts?.full || app.cacheFull?.[key])) return app.cache[key];
  if (app.inflight[key]) return app.inflight[key];
  app.cacheFull = app.cacheFull || {};
  const generation = app.dataGeneration || 0;
  const isRemote = location.hostname !== "127.0.0.1" && location.hostname !== "localhost";
  const task = (async () => {
    if (tfKey === "3mo") {
      const rows = aggregateQuarters(await loadCsv(symbol, "1d", { full: true }), isForexComSymbol(symbol));
      if (generation === (app.dataGeneration || 0)) { app.cache[key] = rows; app.cacheFull[key] = true; }
      return rows;
    }
    const candidates = [];
    if (availableFiles[key]) candidates.push("../data/" + availableFiles[key]);
    const exchanges = ["FOREXCOM", "BINANCE", "CRYPTO", "DERIV"];
    for (const ex of exchanges) {
      candidates.push(`../data/${tfKey}-extended-${ex}-${symbol}.csv`);
      candidates.push(`../data/${tfKey}-${ex}-${symbol}.csv`);
    }
    candidates.push(`../data/${tfKey}-extended-${symbol}.csv`,`../data/${symbol}_${tfKey}.csv`,`../data/${tfKey}_${symbol}.csv`);
    let lastErr = null;
    const useTail = isRemote && !opts?.full && ["15m", "30m", "1h", "4h"].includes(tfKey);
    for (const url of candidates) {
      try {
        const bust = generation > 0 ? ("?t=" + Date.now()) : "";
        const fetchUrl = (useTail ? url.replace("../data/", "../data/tail/") : url) + bust;
        const res = await fetch(fetchUrl, { cache: generation > 0 ? "no-store" : "default", signal: AbortSignal.timeout(60000) });
        if (!res.ok) { LOG("fetch", fetchUrl, res.status); continue; }
        const rows = parseCsvText(await res.text(), url);
        if (!rows.length || !Number.isFinite(rows[0].close)) { lastErr = "Invalid OHLC in " + url; continue; }
        if (generation === (app.dataGeneration || 0)) {
          app.cache[key] = rows;
          if (!useTail) app.cacheFull[key] = true;
          else {
            // Hydrate full history quietly in the background without blocking the chart
            setTimeout(() => {
              fetch(url + bust, { cache: generation > 0 ? "no-store" : "default", signal: AbortSignal.timeout(60000) })
                .then(r => r.ok ? r.text() : null)
                .then(txt => {
                  if (!txt || generation !== (app.dataGeneration || 0)) return;
                  const fullRows = parseCsvText(txt, url);
                  if (fullRows.length > rows.length) {
                    app.cache[key] = fullRows;
                    app.cacheFull[key] = true;
                    if (app.symbol === symbol && app.tf?.key === tfKey && !app.replay.active) {
                      const loc = captureChartLocation();
                      app.fullData = fullRows;
                      applyLiveChartData();
                      restoreChartLocation(loc);
                      Renderer.render();
                    }
                  }
                })
                .catch(() => {});
            }, 300);
          }
        }
        LOG("Loaded", fetchUrl, "→", rows.length, "bars, last close", rows[rows.length-1].close);
        return rows;
      } catch (e) { if (e.name === "TimeoutError" || e.name === "AbortError") throw e; lastErr = e.message; LOG("load fail", url, e.message); }
    }
    throw new Error("No CSV for " + symbol + " " + tfKey + (lastErr ? " (" + lastErr + ")" : ""));
  })();
  app.inflight[key] = task;
  try { return await task; }
  finally { if (app.inflight[key] === task) delete app.inflight[key]; }
}

    wickUpColor: COLOR_UP_SOLID,
    wickDownColor: COLOR_DOWN_SOLID,
    priceScaleId: "right",
  });
  app.lineSeries = app.chart.addSeries(LightweightCharts.LineSeries, {
    color: "#2962ff", lineWidth: 2, priceScaleId: "right", visible: false,
  });
  // Ghost / developing candle (incomplete bar) — semi-transparent TradingView style.
  // This series is intentionally very faint (not the visible ~50% ghost itself):
  // its jobs are (1) feed the shared right price-scale so autoscale includes the
  // developing bar's H/L, and (2) give the crosshair/OHLC readout something to
  // find via param.seriesData.get(). The actual visible ghost is drawn on the
  // canvas overlay (Renderer.drawGhostCandle) so it repaints synchronously with
  // pan/zoom/drawings instead of trailing a frame behind on its own render cycle.
  // Keeping some (low) alpha here too means the developing bar still shows up
  // faintly even in the rare case the canvas draw bails (e.g. mid-resize).
  app.developingSeries = app.chart.addSeries(LightweightCharts.CandlestickSeries, {
    upColor: "rgba(38, 166, 154, 0.18)",
    downColor: "rgba(239, 83, 80, 0.18)",
    borderVisible: false,
    wickUpColor: "rgba(38, 166, 154, 0.18)",
    wickDownColor: "rgba(239, 83, 80, 0.18)",
    priceScaleId: "right",
    lastValueVisible: false,
    priceLineVisible: false,
  });
  applyPriceFormat();
  applyChartType(app.chartType, false);
  Theme.apply(Theme.current, false);

  const area = document.getElementById("chartArea");
  let previousChartWidth=area.clientWidth;
  new ResizeObserver(() => {
    const ts=app.chart.timeScale(),last=app.renderedBars.length-1;
    const before=ts.getVisibleLogicalRange();
    const wasFollowing=!app.replay.active&&last>=0&&before&&last>=before.from&&last<=before.to;
    const rotated=Math.abs(area.clientWidth-previousChartWidth)>120;
    app.chart.applyOptions({ width: area.clientWidth, height: area.clientHeight });
    previousChartWidth=area.clientWidth;
    if(rotated&&wasFollowing)centerOnBar(last,100);
    Renderer.resize();
    const popup=document.getElementById("settingsPopup");
    if(popup)positionPopup(popup,popup._popupShape,popup._popupAnchor);
  }).observe(area);

  app.chart.subscribeCrosshairMove(param => {
    const box = document.getElementById("ohlcLine");
    if (!param?.time || !app.series) { box.textContent = ""; return; }
    let d = param.seriesData?.get(app.series);
    if (!d && app.developingSeries) d = param.seriesData?.get(app.developingSeries);
    if ((!d || d.open == null) && param.time != null) {
      const i = app.renderedBars.findIndex(b => b.time === param.time);
      if (i >= 0) d = app.renderedBars[i];
    }
    if (!d) { box.textContent = ""; return; }
    const isForming = !!(app.replay.developingBar && param.time === app.replay.developingBar.time);
    const ghost = isForming ? "  · forming" : "";
    box.textContent = `O ${formatPrice(d.open)}  H ${formatPrice(d.high)}  L ${formatPrice(d.low)}  C ${formatPrice(d.close)}${ghost}`;
  });

  // CRITICAL: synchronous redraw on every view change — no rAF lag
  const syncPaint = () => Renderer.render();
  app.chart.timeScale().subscribeVisibleLogicalRangeChange(syncPaint);
  // Logical-range notifications already repaint pan/zoom. Avoid the redundant time-range conversion during setData.
  // During pan/zoom gestures, paint on every pointer/wheel event too
  area.addEventListener("pointermove", () => {
    if (!Interaction.drag && Interaction.tool === "cursor") Renderer.render();
  }, { passive: true });
  area.addEventListener("wheel", syncPaint, { passive: true });

  Renderer.resize();
}

function applyChartType(type, persist = true) {
  app.chartType = type === "line" ? "line" : "candles";
  try { app.series?.applyOptions({ visible: app.chartType === "candles" }); } catch (_) {}
  try { app.developingSeries?.applyOptions({ visible: app.chartType === "candles" }); } catch (_) {}
  try { app.lineSeries?.applyOptions({ visible: app.chartType === "line" }); } catch (_) {}
  const b=document.getElementById("btnChartType"); if(b)b.textContent=app.chartType === "line" ? "Line" : "Candles";
  if (persist) localStorage.setItem("btt2_chart_type_v1", app.chartType);
  Renderer?.render?.();
}

/**
 * Each pair keeps its own replay/live state inside its section.
 * Pairs list is isolated too — EURUSD replay never copies onto GBPUSD.
 * @param opts.section  watchlist section key the click came from
 */
async function setSymbolTf(symbol, tfKey, opts) {
  Observations.capture();
  if (app.replay.playing) {
    clearInterval(app.replay.timer);
    app.replay.playing = false;
    document.getElementById("btnPlayPause").textContent = "▶";
  }
  const task = performSymbolTf(symbol, tfKey, opts);
  const ownRequest = app.loadSeq;
  app.switching = true;
  try { return await task; }
  catch (err) {
    if (ownRequest !== app.loadSeq) return;
    console.error("[BT] timeframe switch failed", err);
    document.getElementById("symbolLabel").textContent = app.symbol + " · " + app.tf.label + " · display error";
    showHint("Chart switch failed: " + err.message + ". Select the timeframe again.");
  } finally {
    if (ownRequest === app.loadSeq) {
      app.switching = false;
      document.querySelectorAll(".tf-btn").forEach(b => b.classList.remove("loading"));
    }
  }
}
// Carry a date anchor, never an array index, between timeframe datasets.
let pendingChartLocation = null;
function captureChartLocation(preferFocus = false) {
  if (pendingChartLocation) return {...pendingChartLocation.location};
  try {
    const range = app.chart?.timeScale().getVisibleLogicalRange();
    const coordinates = window.BTT2Drawing?.coordinates;
    if (!range || !coordinates || !Number.isFinite(range.from) || !Number.isFinite(range.to)) return null;
    const bars = Math.max(2, range.to - range.from);
    let logical = (range.from + range.to) / 2;
    let time = coordinates.logicalToTime(logical);
    if (preferFocus) {
      const shape = Store.selected?.();
      const points = shape?.visible !== false ? (shape?.points || []) : [];
      const candidates = points.map(p => ({time:p.time, logical:coordinates.timeToLogical(p.time)}))
        .filter(p => Number.isFinite(p.logical) && p.logical >= range.from && p.logical <= range.to)
        .sort((a,b) => Math.abs(a.logical-logical) - Math.abs(b.logical-logical));
      let focus = candidates[0];
      if (!focus && app.replay.active && Number.isFinite(app.replay.clockTime)) {
        const replayLogical = coordinates.timeToLogical(app.replay.clockTime);
        if (replayLogical >= range.from && replayLogical <= range.to) focus = {time:app.replay.clockTime,logical:replayLogical};
      }
      if (focus) { time = focus.time; logical = focus.logical; }
    }
    return Number.isFinite(time) ? { time, bars, fraction:(logical-range.from)/bars } : null;
  } catch (_) { return null; }
}
function restoreChartLocation(location) {
  if (!location || !app.renderedBars.length) return false;
  const apply = () => {
    const coordinates = window.BTT2Drawing?.coordinates;
    // Shorter histories cannot show a date that was never downloaded. Use the
    // nearest available candle rather than scrolling to an empty distant date.
    const first = app.renderedBars[0].time;
    const last = app.renderedBars[app.renderedBars.length - 1].time;
    const time = Math.max(first, Math.min(last, location.time));
    const logical = coordinates?.timeToLogical(time);
    if (!Number.isFinite(logical)) return false;
    const from = logical - location.bars * (location.fraction ?? 0.5);
    app.chart.timeScale().setVisibleLogicalRange({ from, to:from+location.bars });
    if (app.replay.active) app.replay.visibleBars = location.bars;
    return true;
  };
  try {
    if (!apply()) return false;
    // Lightweight Charts applies range commands on its next animation frame.
    // A supporting-data repaint must read this date, not the stale old indices.
    if (typeof requestAnimationFrame === 'function') {
      const pending = {location:{...location},symbol:app.symbol,tf:app.tf.key};
      pendingChartLocation = pending;
      requestAnimationFrame(() => {
        if (pendingChartLocation !== pending) return;
        if (app.symbol === pending.symbol && app.tf.key === pending.tf) apply();
        requestAnimationFrame(() => {
          if (pendingChartLocation === pending) pendingChartLocation = null;
        });
      });
    }
    return true;
  } catch (_) { return false; }
}
async function performSymbolTf(symbol, tfKey, opts) {
  const requestId = ++app.loadSeq;
  const clockMode = "isolated";
  void opts;
  const newSection = (opts && opts.section) != null ? opts.section : app.wlSection;
  const newNs = replayNamespace(newSection);
  const prevNs = replayNamespace(app.wlSection);
  let savedRange = null;
  try { savedRange = app.chart?.timeScale().getVisibleRange() ?? null; } catch (_) {}

  const prevSymbol = app.symbol, prevTf = app.tf;
  const prevSection = app.wlSection;
  const symbolChanged = symbol !== prevSymbol;
  const tfChanged = tfKey !== prevTf?.key;
  const sectionChanged = newNs !== prevNs;
  const contextChanged = symbolChanged || sectionChanged;
  const savedLocation = !contextChanged && tfChanged ? captureChartLocation(true) : null;
  if (contextChanged) pendingChartLocation = null;

  // Save working replay into the SECTION we are leaving
  if (contextChanged && prevSymbol) {
    persistReplayForSymbol(prevSymbol, prevSection);
  }
  // Shared clock only when staying inside the same Pairs namespace
  const sharedClock = (symbolChanged && !sectionChanged && clockMode === "shared"
    && app.replay.active && app.replay.clockTime != null)
    ? app.replay.clockTime
    : null;
  // Same pair + same section + TF change: keep clock from this section's map
  const mapForPrev = (app.replayBySection[prevNs] || {})[prevSymbol];
  const preservedClock = (!contextChanged && (app.replay.active || mapForPrev?.active))
    ? (app.replay.pinnedClock ?? app.replay.clockTime ?? mapForPrev?.clockTime)
    : null;

  const nextTf = TIMEFRAMES.find(t => t.key === tfKey) || TIMEFRAMES[0];
  document.getElementById("symbolLabel").textContent = `${symbol} · ${nextTf.label} · Loading…`;
  document.querySelectorAll(".tf-btn").forEach(b => { b.classList.toggle("active", b.dataset.tf === tfKey); b.classList.toggle("loading", b.dataset.tf === tfKey); });
  // Phone: close side panels after picking a pair so chart + replay stay visible
  document.getElementById("app")?.classList.remove("show-watchlist", "show-tools");
  document.getElementById("btnToggleList")?.classList.remove("on");
  document.getElementById("btnToggleTools")?.classList.remove("on");

  let nextFullData;
  try {
    nextFullData = await loadCsv(symbol, tfKey);
  } catch (err) {
    if (requestId !== app.loadSeq) return;
    LOG("setSymbolTf failed", err.message);
    showHint("No data for " + symbol + " " + tfKey);
    document.getElementById("symbolLabel").textContent = app.fullData.length
      ? `${prevSymbol} · ${prevTf.label}` : `${symbol} · ${nextTf.label} (no data)`;
    document.querySelectorAll(".tf-btn").forEach(b => { b.classList.toggle("active", b.dataset.tf === app.tf?.key); b.classList.remove("loading"); });
    updateWatchlistSelection();
    return false;
  }
  if (requestId !== app.loadSeq) return;

  // Commit metadata and drawing context only once the requested data exists.
  app.wlSection = newSection;
  app.symbol = symbol;
  app.tf = nextTf;
  applyPriceFormat();
  updateWatchlistSelection();
  if (symbolChanged || sectionChanged) {
    Store.onSymbolChange();
    Interaction.draft = null;
    Interaction.drag = null;
    closeStylePanel();
  }

  // Commit the selected timeframe immediately. Supporting lower-timeframe files
  // continue loading below, but the user sees the requested candles at once.
  app.fullData = nextFullData;
  app.finestData = nextFullData;
  app.lowerByTf = {};
  app.builderData = [];
  app.builderTfKey = null;
  if (!app.replay.active && preservedClock == null) {
    applyLiveChartData();
    centerOnBar(app.fullData.length - 1, 100);
    Renderer.render();
  }

  const lowerKeys = TF_ORDER.slice(0, Math.max(0, TF_ORDER.indexOf(tfKey)));
  for (const key of lowerKeys) {
    const rows = app.cache[symbol + "_" + key];
    if (rows?.length) app.lowerByTf[key] = rows;
  }
  app.finestData = app.lowerByTf[FINEST.key] || nextFullData;
  // The first render uses cached lower bars; missing files enhance the ghost later.
  // On remote/mobile connections, only preload lower TFs when replay is active,
  // and fetch sequentially so user's active timeframe switch is never choked.
  const isLocalHost = location.hostname === "127.0.0.1" || location.hostname === "localhost";
  const keysToPreload = (isLocalHost || app.replay.active || preservedClock != null) ? lowerKeys : [];
  void (async () => {
    const results = [];
    for (const key of keysToPreload) {
      if (requestId !== app.loadSeq) return results;
      try { results.push([key, await loadCsv(symbol, key)]); } catch (_) { results.push([key, null]); }
    }
    return results;
  })().then(results => {
    if (requestId !== app.loadSeq) return;
    for (const [key, rows] of results) if (rows?.length) app.lowerByTf[key] = rows;
    app.finestData = app.lowerByTf[FINEST.key] || nextFullData;
    const location = captureChartLocation();
    if (app.replay.active) {
      syncReplayFineIndexFromClock();
      renderReplayFrame();
    } else { applyLiveChartData(); Renderer.render(); }
    // Supporting data must not undo the switch or a pan made while it loaded.
    restoreChartLocation(location);
    Renderer.render();
  }).catch(err => console.error("[BT] supporting candle repaint failed", err));

  if (contextChanged) {
    if (sharedClock != null) {
      // Pairs list (same section): carry the same replay clock onto the new pair
      app.replay.active = true;
      app.replay.clockTime = sharedClock;
      app.replay.barIndex = -1;
      app.replay.fineIndex = -1;
      app.replay.pinnedClock = null;
      ["btnStepBack", "btnPlayPause", "btnStepFwd", "btnExitReplay"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = false;
      });
      if (app.fullData.length) {
        const first = app.fullData[0].time;
        const last = candleEndTime(app.fullData[app.fullData.length - 1], app.tf.key);
        if (sharedClock < first || sharedClock > last) {
          app.replay.pinnedClock = sharedClock;
        }
      }
      syncReplayBarIndexFromClock();
      syncReplayFineIndexFromClock();
      renderReplayFrame({ forceMedium: true });
      persistReplayForSymbol(symbol, app.wlSection);
    } else {
      // THIS section's state only (Pairs stays live if never started there)
      const hasReplay = restoreReplayForSymbol(symbol, app.wlSection);
      if (hasReplay) {
        const trueClock = app.replay.clockTime;
        if (trueClock != null && app.fullData.length) {
          const first = app.fullData[0].time;
          const last = candleEndTime(app.fullData[app.fullData.length - 1], app.tf.key);
          if (trueClock < first || trueClock > last) {
            app.replay.pinnedClock = trueClock;
          } else {
            app.replay.pinnedClock = null;
          }
        }
        syncReplayBarIndexFromClock();
        syncReplayFineIndexFromClock();
        renderReplayFrame({ forceMedium: true });
        if (trueClock != null && app.fullData.length) {
          const first = app.fullData[0].time;
          const last = candleEndTime(app.fullData[app.fullData.length - 1], app.tf.key);
          if (trueClock >= first && trueClock <= last) {
            app.replay.clockTime = trueClock;
            app.replay.pinnedClock = null;
            syncReplayBarIndexFromClock();
            syncReplayFineIndexFromClock();
            renderReplayFrame({ forceMedium: true });
          }
        }
        persistReplayForSymbol(symbol, app.wlSection);
      } else {
        applyLiveChartData();
        try {
          activePriceSeries()?.priceScale().applyOptions({ autoScale: true });
        } catch (_) {}
        try {
          app.chart.priceScale("right").applyOptions({ autoScale: true });
        } catch (_) {}
        centerOnBar(app.fullData.length - 1, 100);
      }
    }
  } else if (app.replay.active || preservedClock != null) {
    // Same pair, TF change while replaying: keep the true clock
    if (preservedClock != null) app.replay.clockTime = preservedClock;
    app.replay.active = true;
    ["btnStepBack", "btnPlayPause", "btnStepFwd", "btnExitReplay"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.disabled = false;
    });
    const trueClock = app.replay.clockTime;
    syncReplayBarIndexFromClock();
    syncReplayFineIndexFromClock();
    renderReplayFrame({ forceMedium: tfChanged });
    // Restore true clock if this TF covers it (don't stay stuck on clamp from a TF with no early data)
    if (trueClock != null && app.fullData.length) {
      const first = app.fullData[0].time;
      const last = candleEndTime(app.fullData[app.fullData.length - 1], app.tf.key);
      if (trueClock >= first && trueClock <= last) {
        app.replay.clockTime = trueClock;
        syncReplayBarIndexFromClock();
        syncReplayFineIndexFromClock();
        renderReplayFrame({ forceMedium: false });
      } else {
        // This TF has no bars at the saved clock (e.g. 15m starts 2026, clock is 2024).
        // Pin true clock so stepping/clamping cannot erase it; restore when TF covers it again.
        app.replay.pinnedClock = trueClock;
        showHint("No " + tfKey + " data at this replay time — switch TF or date");
      }
    } else {
      app.replay.pinnedClock = null;
    }
    persistReplayForSymbol(symbol, app.wlSection);
  } else {
    // Live view
    applyLiveChartData();
    if (!tfChanged && savedRange?.from != null && savedRange?.to != null) {
      try { app.chart.timeScale().setVisibleRange(savedRange); }
      catch { centerOnBar(app.fullData.length - 1, 100); }
    } else {
      centerOnBar(app.fullData.length - 1, 100);
    }
  }
  restoreChartLocation(savedLocation);
  Renderer.resize();
  Renderer.render();
  document.getElementById("symbolLabel").textContent = `${symbol} · ${app.tf.label}`;
  document.querySelectorAll(".tf-btn").forEach(b => b.classList.remove("loading"));
  showHint("");
  Session.save();
  LOG("setSymbolTf", symbol, tfKey, "bars", app.fullData.length, "drawings", Store.items.length);
  window.dispatchEvent(new CustomEvent('btt2-chart-change', {detail:{symbol:app.symbol,tf:app.tf.key,section:app.wlSection}}));
  return true;
}

// ── Watchlist favorites & sections (persisted in localStorage) ──
const FavStore = {
  KEY: "btt2_watchlist_v1",
  // Stars are PER LIST key. Nested BT lists: btForex_s1, btForex_s2, btOther_s1, …
  data: {
    stars: {
      section1: {}, section2: {}, pairs: {}, replay: {},
      btForex: {}, btForex_s1: {}, btForex_s2: {},
      btOther: {}, btOther_s1: {}, btOther_s2: {},
    },
    section1: [],
    section2: [],
    replayOpen: false,
    btForexOpen: false,
    btOtherOpen: false,
    /** Shared start dates (YYYY-MM-DD) for each backtesting group */
    btForexDate: "",
    btOtherDate: "",
    /** Custom picks inside each backtesting group */
    btForex_s1: [],
    btForex_s2: [],
    btOther_s1: [],
    btOther_s2: [],
  },

  _secKey(sec) {
    if (sec === 1 || sec === "section1") return "section1";
    if (sec === 2 || sec === "section2") return "section2";
    if (sec === "pairs") return "pairs";
    if (sec === "replay") return "replay";
    if (sec === "btForex") return "btForex";
    if (sec === "btOther") return "btOther";
    if (sec === "btForex_s1" || sec === "btForex_s2" || sec === "btOther_s1" || sec === "btOther_s2") return sec;
    return "pairs";
  },

  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        this.data.section1 = Array.isArray(parsed.section1) ? parsed.section1 : [];
        this.data.section2 = Array.isArray(parsed.section2) ? parsed.section2 : [];
        this.data.replayOpen = !!parsed.replayOpen;
        this.data.btForexOpen = !!parsed.btForexOpen;
        this.data.btOtherOpen = !!parsed.btOtherOpen;
        this.data.btForexDate = parsed.btForexDate || "";
        this.data.btOtherDate = parsed.btOtherDate || "";
        this.data.btForex_s1 = Array.isArray(parsed.btForex_s1) ? parsed.btForex_s1 : [];
        this.data.btForex_s2 = Array.isArray(parsed.btForex_s2) ? parsed.btForex_s2 : [];
        this.data.btOther_s1 = Array.isArray(parsed.btOther_s1) ? parsed.btOther_s1 : [];
        this.data.btOther_s2 = Array.isArray(parsed.btOther_s2) ? parsed.btOther_s2 : [];
        if (parsed.stars && !parsed.stars.section1 && !parsed.stars.pairs) {
          this.data.stars = {
            section1: {}, section2: {}, pairs: { ...(parsed.stars || {}) }, replay: {},
            btForex: {}, btForex_s1: {}, btForex_s2: {}, btOther: {}, btOther_s1: {}, btOther_s2: {},
          };
        } else {
          const s = parsed.stars || {};
          this.data.stars = {
            section1: s.section1 || {}, section2: s.section2 || {},
            pairs: s.pairs || {}, replay: s.replay || {},
            btForex: s.btForex || {}, btForex_s1: s.btForex_s1 || {}, btForex_s2: s.btForex_s2 || {},
            btOther: s.btOther || {}, btOther_s1: s.btOther_s1 || {}, btOther_s2: s.btOther_s2 || {},
          };
        }
      }
    } catch (_) {}
  },
  save() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (_) {}
  },
  starOf(sec, sym) {
    const k = this._secKey(sec);
    if (!this.data.stars[k]) this.data.stars[k] = {};
    return this.data.stars[k][sym] || null;
  },
  setStar(sec, sym, color) {
    const k = this._secKey(sec);
    if (!this.data.stars[k]) this.data.stars[k] = {};
    if (!color) delete this.data.stars[k][sym];
    else this.data.stars[k][sym] = color;
    this.save();
  },
  cycleStar(sec, sym) {
    const cur = this.starOf(sec, sym);
    // blue → red → black (no setup) → off
    const next = cur === null ? "blue" : cur === "blue" ? "red" : cur === "red" ? "black" : null;
    this.setStar(sec, sym, next);
    return next;
  },
  _listArr(sec) {
    if (sec === 1 || sec === "section1") return this.data.section1;
    if (sec === 2 || sec === "section2") return this.data.section2;
    if (sec === "btForex_s1") return this.data.btForex_s1;
    if (sec === "btForex_s2") return this.data.btForex_s2;
    if (sec === "btOther_s1") return this.data.btOther_s1;
    if (sec === "btOther_s2") return this.data.btOther_s2;
    return null;
  },
  inSection(sec, sym) {
    if (sec === "replay" || sec === "pairs" || sec === "btForex" || sec === "btOther") return true;
    const arr = this._listArr(sec);
    return arr ? arr.includes(sym) : false;
  },
  addToSection(sec, sym) {
    if (sec === "replay" || sec === "pairs" || sec === "btForex" || sec === "btOther") return;
    const arr = this._listArr(sec);
    if (!arr) return;
    if (!arr.includes(sym)) arr.push(sym);
    // pair sibling s1/s2 within same BT group or global
    let other = null;
    let starFrom = null; // copy star from parent All list of this block
    if (sec === 1 || sec === "section1") { other = this.data.section2; starFrom = "pairs"; }
    else if (sec === 2 || sec === "section2") { other = this.data.section1; starFrom = "pairs"; }
    else if (sec === "btForex_s1") { other = this.data.btForex_s2; starFrom = "btForex"; }
    else if (sec === "btForex_s2") { other = this.data.btForex_s1; starFrom = "btForex"; }
    else if (sec === "btOther_s1") { other = this.data.btOther_s2; starFrom = "btOther"; }
    else if (sec === "btOther_s2") { other = this.data.btOther_s1; starFrom = "btOther"; }
    if (other) {
      const i = other.indexOf(sym);
      if (i >= 0) other.splice(i, 1);
    }
    // Carry star into the section so it still shows there
    if (starFrom) {
      const existing = this.starOf(sec, sym);
      if (!existing) {
        const parentStar = this.starOf(starFrom, sym);
        if (parentStar) this.setStar(sec, sym, parentStar);
      }
    }
    this.save();
  },
  removeFromSection(sec, sym) {
    if (sec === "replay" || sec === "pairs" || sec === "btForex" || sec === "btOther") return;
    const arr = this._listArr(sec);
    if (!arr) return;
    const i = arr.indexOf(sym);
    if (i >= 0) arr.splice(i, 1);
    this.save();
  },
};

/**
 * Apply a shared start date to every pair in a backtesting group.
 * After this, each pair can still advance independently when you play it.
 * @param {"btForex"|"btOther"} group
 * @param {string} dateStr YYYY-MM-DD
 */
async function applyBtSectionDate(group, dateStr) {
  if (!dateStr) return;
  const pairs = group === "btForex" ? FOREX_PAIRS : OTHER_PAIRS;
  const ns = replayNamespace(group); // btForex | btOther only
  const unix = Math.floor(new Date(dateStr + "T00:00:00Z").getTime() / 1000);
  if (!Number.isFinite(unix)) return;
  if (group === "btForex") FavStore.data.btForexDate = dateStr;
  else FavStore.data.btOtherDate = dateStr;
  FavStore.save();
  if (!app.replayBySection[ns]) app.replayBySection[ns] = {};
  for (const sym of pairs) {
    // Only this backtesting namespace — never Pairs / Replay
    app.replayBySection[ns][sym] = {
      active: true,
      clockTime: unix,
      speedMs: app.replay.speedMs || 400,
      visibleBars: app.replay.visibleBars || 100,
    };
  }
  showHint("Backtest date set — all pairs in this list start at " + dateStr);
  // Jump chart only if currently inside this BT group
  if (pairs.includes(app.symbol) && replayNamespace(app.wlSection) === ns) {
    try {
      await startReplayAt(unix);
    } catch (_) {}
  }
  try { Session.save(); } catch (_) {}
}
