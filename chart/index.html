// Replay
/**
 * Period end for a bar.
 * Prefer next bar's open (true period boundary in the series).
 * Fallback estimates for the last bar / when index unknown.
 */
function candleEndTime(c, tfKey, data, idx) {
  if (data && idx != null && idx >= 0 && idx + 1 < data.length) {
    return data[idx + 1].time;
  }
  if (tfKey === "3mo") {
    const forex = isForexComSymbol();
    const date = new Date(BttTime.dateStamp(c.time, '1d', forex, 'UTC') * 1000);
    let next = Date.UTC(date.getUTCFullYear(), Math.floor(date.getUTCMonth()/3)*3+3, 1)/1000;
    if (forex) {
      // First trading day of the new quarter; session starts the prior evening.
      while ([0,6].includes(new Date(next*1000).getUTCDay())) next += 86400;
      const hour = ['XAUUSD','XAGUSD','USOIL'].includes(app.symbol) ? 18 : 17;
      return BttTime.fromWall(next-86400+hour*3600, 'America/New_York') + BttTime.OFFSET;
    }
    return next + BttTime.OFFSET;
  }
  if (tfKey === "1mo") {
    const d = new Date(c.time * 1000);
    return Math.floor(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1) / 1000);
  }
  if (tfKey === "1w") {
    // Monday 00:00 UTC week of this open → end = next Monday (exclusive)
    const d = new Date(c.time * 1000);
    const day = d.getUTCDay();
    const fromMon = (day + 6) % 7;
    const startMs = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - fromMon);
    return Math.floor(startMs / 1000) + 7 * 86400;
  }
  const tf = TIMEFRAMES.find(t => t.key === tfKey);
  return (tf && tf.secs) ? c.time + tf.secs : c.time + 900;
}

/** End time of series[i] for a known TF key */
function barEndAt(series, i, tfKey) {
  if (!series || i < 0 || i >= series.length) return null;
  return candleEndTime(series[i], tfKey, series, i);
}

/**
 * True when a series covers this clock (through last bar's period end).
 */
function seriesCoversClock(series, clock) {
  if (clock == null || !series || !series.length) return false;
  if (clock < series[0].time) return false;
  const last = series[series.length - 1];
  // Infer TF of series from spacing when possible; else allow through last.time + longest common
  const lastEnd = series.length >= 2
    ? Math.max(last.time + (last.time - series[series.length - 2].time), last.time)
    : last.time;
  return clock <= lastEnd || clock <= last.time;
}

/**
 * True when genuine 15m (finest) data covers this clock.
 */
function fineCoversClock(clock) {
  if (clock == null) return false;
  if (app.tf.key === FINEST.key) return true;
  const fine = app.finestData;
  if (!fine || !fine.length || fine === app.fullData) return false;
  return seriesCoversClock(fine, clock);
}

/**
 * Resolve the best lower-TF series for progressive formation at this clock.
 * Finest-first: 15m → 30m → 1h → 4h → 1d → 1w so any lower move updates all HTFs.
 */
function getBuilderForClock(clock) {
  if (clock == null) return null;
  const tfIdx = TF_ORDER.indexOf(app.tf.key);
  if (tfIdx <= 0) return null;
  for (let i = 0; i < tfIdx; i++) {
    const key = TF_ORDER[i];
    const data = app.lowerByTf[key];
    if (data && data.length && data !== app.fullData && seriesCoversClock(data, clock)) {
      return { data, key };
    }
  }
  if (app.builderData && app.builderData.length && app.builderData !== app.fullData && seriesCoversClock(app.builderData, clock)) {
    return { data: app.builderData, key: app.builderTfKey || FINEST.key };
  }
  if (app.finestData && app.finestData.length && app.finestData !== app.fullData && fineCoversClock(clock)) {
    return { data: app.finestData, key: FINEST.key };
  }
  return null;
}

/**
 * Build OHLC for a developing HTF bar from lower-TF sub-bars up to clock.
 * NO LOOKAHEAD: only FULLY CLOSED lower bars (period end <= clock).
 * As each lower bar closes, high/low/close update → live rejection / continuation on the ghost.
 * Never uses the finished HTF CSV high/low/close while the HTF period is still open.
 */
function buildDevelopingFromFinest(periodStart, clock, periodEnd) {
  if (periodStart == null || clock == null) return null;
  const builder = getBuilderForClock(clock);
  if (!builder) return null;

  const src = builder.data;
  const lowerKey = builder.key || FINEST.key;
  const endLimit = periodEnd != null ? periodEnd : Infinity;

  // First index with time >= periodStart
  let lo = 0, hi = src.length - 1, start = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (src[mid].time >= periodStart) { start = mid; hi = mid - 1; }
    else lo = mid + 1;
  }
  if (start === -1) return null;

  let open = null, high = -Infinity, low = Infinity, close = null;
  for (let i = start; i < src.length; i++) {
    const c = src[i];
    if (c.time >= endLimit) break;
    if (c.time > clock) break;
    // Period of this lower bar must have fully ended by clock
    const cEnd = barEndAt(src, i, lowerKey);
    if (cEnd == null || cEnd > clock) break;
    if (open === null) open = c.open;
    if (c.high > high) high = c.high;
    if (c.low < low) low = c.low;
    close = c.close;
  }

  if (open === null) {
    // No fully closed lower bar yet — open-only of first lower bar that has started
    for (let i = start; i < src.length; i++) {
      const c = src[i];
      if (c.time > clock) break;
      if (c.time >= periodStart && c.time < endLimit) {
        return { time: periodStart, open: c.open, high: c.open, low: c.open, close: c.open };
      }
    }
    return null;
  }
  return { time: periodStart, open, high, low, close };
}

/**
 * Split fullData at replay clock into completed (solid) + developing (ghost).
 * A bar is solid only when its period has fully ended (next bar open or estimate <= clock).
 * Developing OHLC is rebuilt from closed lower bars only — never finished HTF range.
 */
function barsAtClock(clock) {
  const tfKey = app.tf.key;
  const data = app.fullData;
  if (!data.length || clock == null) return { completed: [], developing: null };

  // Completed = bars whose full period has ended (end <= clock)
  let closedUpTo = -1;
  for (let i = 0; i < data.length; i++) {
    const end = candleEndTime(data[i], tfKey, data, i);
    if (end <= clock) closedUpTo = i;
    else break;
  }
  const completed = closedUpTo >= 0 ? data.slice(0, closedUpTo + 1) : [];

  // Developing = opened but not ended
  let developing = null;
  const openIdx = closedUpTo + 1;
  if (openIdx < data.length) {
    const candidate = data[openIdx];
    const end = candleEndTime(candidate, tfKey, data, openIdx);
    if (candidate.time <= clock && end > clock) {
      developing = buildDevelopingFromFinest(candidate.time, clock, end);
      if (!developing) {
        // No lower coverage: open-only — never finished HTF H/L/C
        developing = {
          time: candidate.time,
          open: candidate.open,
          high: candidate.open,
          low: candidate.open,
          close: candidate.open,
        };
      }
    }
  }
  return { completed, developing };
}

function setDevelopingBar(bar) {
  // Stored for canvas ghost rendering (reliable 50% opacity)
  app.replay.developingBar = bar || null;
  if (!app.developingSeries) return;
  // Also feed LC series so price scale / crosshair know about the bar
  if (bar) app.developingSeries.setData([bar]);
  else app.developingSeries.setData([]);
}

/** Preferred bars on screen (total viewport width in logical bars) */
const REPLAY_VISIBLE_BARS = 100;

/**
 * Center the viewport on a logical bar index.
 * Active bar sits in the MIDDLE of the screen — never snapped to the far right.
 * Left half = history, right half = empty space ahead.
 */
function centerOnBar(barIndex, visibleBars) {
  if (!app.chart) return;
  const ts = app.chart.timeScale();
  const vis = Math.max(20, visibleBars || 100);
  const half = vis / 2;
  try {
    ts.applyOptions({ rightOffset: 0, barSpacing: 6 });
    ts.setVisibleLogicalRange({ from: barIndex - half, to: barIndex + half });
  } catch (_) {}
}

/**
 * forceMedium (enter replay / switch pair in replay):
 *   set medium zoom, lock visibleBars, disable auto-shift, center on active bar
 * step / play:
 *   re-center on the newest printed bar with the SAME fixed bar count
 *   (never scrollToRealTime — that was the far-right snap)
 */
let replayFollowLatest = localStorage.getItem('btt2_replay_follow_v1') === 'true';
window.BTT2Replay = {
  get follow() { return replayFollowLatest; },
  setFollow(value) {
    replayFollowLatest = !!value;
    localStorage.setItem('btt2_replay_follow_v1', String(replayFollowLatest));
    if (replayFollowLatest && app.replay.active) centerOnBar(Math.max(0, app.renderedBars.length - 1), app.replay.visibleBars);
    window.dispatchEvent(new CustomEvent('btt2-replay-follow', {detail:{follow:replayFollowLatest}}));
    return replayFollowLatest;
  },
};
function fitReplayView(forceMedium, barsLen, previousRange) {
  // barsLen = completed + (developing ? 1 : 0) — passed from renderReplayFrame
  const lastIdx = Math.max(0, (barsLen || 1) - 1);

  if (forceMedium) {
    try {
      activePriceSeries()?.priceScale().applyOptions({ autoScale: true });
      app.chart.priceScale("right").applyOptions({
        autoScale: true,
        scaleMargins: { top: 0.12, bottom: 0.12 },
      });
    } catch (_) {}
    app.replay.visibleBars = REPLAY_VISIBLE_BARS;
    try {
      app.chart.timeScale().applyOptions({
        shiftVisibleRangeOnNewBar: false,
        rightOffset: 0,
        barSpacing: 6,
      });
    } catch (_) {}
  }

  const vis = app.replay.visibleBars || REPLAY_VISIBLE_BARS;
  if (forceMedium || replayFollowLatest) centerOnBar(lastIdx, vis);
  else if (previousRange) {
    try { app.chart.timeScale().setVisibleLogicalRange(previousRange); } catch (_) {}
  }
}

/**
 * Clamp replay clock to loaded data for the current pair/TF.
 * Returns true if there is at least one candle to show.
 */
function ensureReplayClockInData() {
  if (!app.fullData.length) return false;
  // Allow clock at bar open so a developing candle can appear before the first close
  const firstStart = app.fullData[0].time;
  const lastEnd = candleEndTime(app.fullData[app.fullData.length - 1], app.tf.key);
  if (app.replay.clockTime == null || !Number.isFinite(app.replay.clockTime)) {
    app.replay.clockTime = firstStart;
  } else if (app.replay.clockTime < firstStart) {
    app.replay.clockTime = firstStart;
  } else if (app.replay.clockTime > lastEnd) {
    app.replay.clockTime = lastEnd;
  }
  return true;
}

function renderReplayFrame(opts) {
  const forceMedium = !!(opts && opts.forceMedium);
  const previousRange = app.chart?.timeScale().getVisibleLogicalRange();
  if (!ensureReplayClockInData()) {
    setPrimaryData([]);
    setDevelopingBar(null);
    app.replay.ghostLogical = null;
    document.getElementById("replayStatus").textContent = "Replay: no data";
    Renderer.render();
    return;
  }
  const clock = app.replay.clockTime;
  let { completed, developing } = barsAtClock(clock);

  // Safety net: if barsAtClock missed an in-progress bar (e.g. HTF/fine
  // misalignment on start), find any bar where time <= clock < end and force it.
  if (!developing && app.fullData.length) {
    for (let i = 0; i < app.fullData.length; i++) {
      const c = app.fullData[i];
      const end = candleEndTime(c, app.tf.key, app.fullData, i);
      if (c.time <= clock && clock < end) {
        developing = buildDevelopingFromFinest(c.time, clock, end) || {
          time: c.time, open: c.open, high: c.open, low: c.open, close: c.open,
        };
        completed = completed.filter(x => x.time !== c.time);
        break;
      }
    }
  }

  // Main series: completed (solid) + developing (faded via per-bar color overrides)
  const bars = completed.slice();
  if (developing) {
    bars.push(toFadedCandle(developing));
    app.replay.ghostLogical = completed.length;
  } else {
    app.replay.ghostLogical = null;
  }
  if (!bars.length && app.fullData.length) {
    bars.push(app.fullData[0]);
  }

  setPrimaryData(bars);
  setDevelopingBar(developing);
  const totalBars = completed.length + (developing ? 1 : 0);
  fitReplayView(forceMedium, totalBars || 1, previousRange);
  const forming = developing ? " · forming" : "";
  document.getElementById("replayStatus").textContent =
    "Replay: " + displayClock(clock) + " " + chartTimezone + forming;
  Renderer.render();
}

/**
 * Live view: if wall-clock is still inside the last bar's period, show that
 * last bar as faded and rebuild its OHLC from fully-closed lower-TF data only.
 * Fallback is open-only — never the finished HTF high/low/close.
 */
function applyLiveChartData() {
  if (!app.fullData.length || !app.series) return;
  const now = Math.floor(Date.now() / 1000) + BttTime.OFFSET;
  const lastIdx = app.fullData.length - 1;
  const last = app.fullData[lastIdx];
  const end = candleEndTime(last, app.tf.key, app.fullData, lastIdx);
  if (now < end) {
    const body = buildDevelopingFromFinest(last.time, now, end) || {
      time: last.time,
      open: last.open,
      high: last.open,
      low: last.open,
      close: last.open,
    };
    const completed = app.fullData.slice(0, -1);
    setPrimaryData(completed.concat([toFadedCandle(body)]));
    setDevelopingBar(body);
  } else {
    setPrimaryData(app.fullData);
    setDevelopingBar(null);
  }
}

/**
 * Find the exact fullData index for a selected calendar date (unix seconds).
 * - Prefer the first bar that opens on that UTC calendar day
 * - Else the last bar that opened on or before that day (higher TFs / weekends)
 * Never jumps months ahead of the selected date.
 */
function findBarIndexForTime(time) {
  if (!app.fullData.length) return 0;
  const selectedDate = new Date(time * 1000).toISOString().slice(0,10);
  return BttTime.findDate(app.fullData,selectedDate,app.tf.key,isForexComSymbol(),chartTimezone);
}

/** Sync barIndex from clockTime after TF change (fullData is a different array). */
function syncReplayBarIndexFromClock() {
  if (!app.fullData.length) {
    app.replay.barIndex = -1;
    return;
  }
  let idx = -1;
  for (let i = 0; i < app.fullData.length; i++) {
    if (app.fullData[i].time <= app.replay.clockTime) idx = i;
    else break;
  }
  app.replay.barIndex = idx;
}

/**
 * Lower-TF series used for sub-candle stepping (drives progressive ghost OHLC).
 * Finest available lower series so stepping is as granular as data allows.
 * Never returns HTF fullData masquerading as lower.
 */
function fineSeries() {
  if (app.tf.key === FINEST.key) return app.fullData;
  const tfIdx = TF_ORDER.indexOf(app.tf.key);
  for (let i = 0; i < tfIdx; i++) {
    const data = app.lowerByTf[TF_ORDER[i]];
    if (data && data.length && data !== app.fullData) return data;
  }
  if (app.builderData && app.builderData.length && app.builderData !== app.fullData) {
    return app.builderData;
  }
  if (app.finestData && app.finestData.length && app.finestData !== app.fullData) {
    return app.finestData;
  }
  return [];
}

/** True when the step series (builder or finest) covers this clock. */
function stepSeriesCoversClock(clock) {
  if (clock == null) return false;
  if (app.tf.key === FINEST.key) return true;
  const series = fineSeries();
  return series.length > 0 && seriesCoversClock(series, clock);
}

/**
 * Pin fineIndex to the last step-series bar at or before clock.
 * Returns -1 when no lower data covers this clock (older historical ranges).
 * NEVER force 0 — that jumped the clock to the start of the lower series.
 */
function syncReplayFineIndexFromClock() {
  const clock = app.replay.clockTime;
  if (!stepSeriesCoversClock(clock)) {
    app.replay.fineIndex = -1;
    return;
  }
  const fine = fineSeries();
  if (!fine.length) {
    app.replay.fineIndex = -1;
    return;
  }
  let lo = 0, hi = fine.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (fine[mid].time <= clock) { ans = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  app.replay.fineIndex = ans;
}

async function ensureFinestDataLoaded() {
  if (app.tf.key === FINEST.key) {
    app.finestData = app.fullData;
    return;
  }
  if (!(app.finestData && app.finestData.length && app.finestData !== app.fullData)) {
    try {
      app.finestData = await loadCsv(app.symbol, FINEST.key);
    } catch (_) {
      app.finestData = app.fullData;
    }
  }
  if (app.finestData && app.finestData.length && app.finestData !== app.fullData) {
    app.lowerByTf[FINEST.key] = app.finestData;
    if (!app.builderData || !app.builderData.length) {
      app.builderData = app.finestData;
      app.builderTfKey = FINEST.key;
    }
  }
}

/**
 * Start replay at a calendar date — timeframe-agnostic.
 * Anchors the clock to the first lower-TF sub-bar inside the selected HTF period
 * so the candle is treated as developing (faded). Uses preferred builder
 * (1h when on 4h, 15m when on 1h, …) when available.
 */
function exactReplayBarIndex(rows,time) {
  let lo=0,hi=rows.length-1,result=0;
  while(lo<=hi){const mid=(lo+hi)>>1;if(rows[mid].time<=time){result=mid;lo=mid+1;}else hi=mid-1;}
  return result;
}
async function startReplayAt(time, options={}) {
  if (!app.fullData.length) return;
  const selectedData=app.fullData, selectedSection=app.wlSection;

  // Guarantee lower-TF data is in memory for progressive formation
  await ensureFinestDataLoaded();

  // Ignore an outdated selection if the user changed chart while data loaded.
  if(app.fullData!==selectedData || app.wlSection!==selectedSection) return;
  app.replay.active=true;
  clearInterval(app.replay.timer);app.replay.playing=false;
  document.getElementById('btnPlayPause').textContent='▶';
  const idx = options.exactCandle ? exactReplayBarIndex(app.fullData,time) : findBarIndexForTime(time);
  const htfBar = app.fullData[idx];
  const periodStart = htfBar.time;
  const periodEnd = candleEndTime(htfBar, app.tf.key, app.fullData, idx);

  // Anchor to the first lower-TF sub-bar inside this HTF period
  const fine = fineSeries();
  let fIdx = -1;
  if (fine.length) {
    // First lower bar with time >= periodStart
    let lo = 0, hi = fine.length - 1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (fine[mid].time >= periodStart) { fIdx = mid; hi = mid - 1; }
      else lo = mid + 1;
    }
    // Must stay inside this HTF period
    if (fIdx >= 0 && fine[fIdx].time >= periodEnd) fIdx = -1;
  }

  if (fIdx >= 0) {
    app.replay.fineIndex = fIdx;
    // Clock = open of first lower sub-bar → HTF period has started but not closed
    app.replay.clockTime = fine[fIdx].time;
  } else {
    // No lower coverage: still start at HTF open so barsAtClock marks it developing
    // (clock must be strictly before periodEnd)
    app.replay.fineIndex = -1;
    app.replay.clockTime = periodStart;
    syncReplayFineIndexFromClock();
  }

  // Safety: never start at or past period end (that would mark the bar solid)
  if (app.replay.clockTime >= periodEnd) {
    app.replay.clockTime = periodStart;
  }

  syncReplayBarIndexFromClock();

  LOG("replay start", {
    date: new Date(time * 1000).toISOString().slice(0, 10),
    tf: app.tf.key,
    barIndex: app.replay.barIndex,
    fineIndex: app.replay.fineIndex,
    clock: new Date(app.replay.clockTime * 1000).toISOString().slice(0, 16),
    periodStart: new Date(periodStart * 1000).toISOString().slice(0, 16),
    periodEnd: new Date(periodEnd * 1000).toISOString().slice(0, 16),
  });

  ["btnStepBack", "btnPlayPause", "btnStepFwd", "btnExitReplay"].forEach(id => {
    document.getElementById(id).disabled = false;
  });
  app.replay.pinnedClock = null;
  renderReplayFrame({ forceMedium: true });
  persistReplayForSymbol(app.symbol, app.wlSection);
  Session.save();
}

function exitReplay() {
  app.replay.active = false;
  app.replay.playing = false;
  app.replay.pinnedClock = null;
  clearInterval(app.replay.timer);
  document.getElementById("btnPlayPause").textContent = "▶";
  // Clear THIS SECTION's saved replay for this pair only
  if (app.symbol) {
    const ns = replayNamespace(app.wlSection);
    if (!app.replayBySection[ns]) app.replayBySection[ns] = {};
    app.replayBySection[ns][app.symbol] = {
      active: false,
      clockTime: null,
      speedMs: app.replay.speedMs || 400,
      visibleBars: app.replay.visibleBars || 100,
    };
  }
  applyLiveChartData();
  try {
    activePriceSeries()?.priceScale().applyOptions({ autoScale: true });
  } catch (_) {}
  try {
    app.chart.timeScale().applyOptions({ shiftVisibleRangeOnNewBar: true, rightOffset: 0, barSpacing: 6 });
  } catch (_) {}
  centerOnBar(app.fullData.length - 1, 100);
  document.getElementById("replayStatus").textContent = "Live view";
  ["btnStepBack", "btnPlayPause", "btnStepFwd", "btnExitReplay"].forEach(id => {
    document.getElementById(id).disabled = true;
  });
  Renderer.render();
  Session.save();
}

  if (v === 900 || v === 1000) return 1000;

  return v === 40 ? 40 : 400;
}

function stepChartBar(direction) {
  const data = app.fullData, clock = app.replay.clockTime;
  let target = null;
  if (direction > 0) {
    for (let i = 0; i < data.length; i++) {
      const end = candleEndTime(data[i], app.tf.key, data, i);
      if (end > clock) { target = end; break; }
    }
  } else {
    for (let i = data.length - 1; i >= 0; i--) {
      const end = candleEndTime(data[i], app.tf.key, data, i);
      if (end < clock) { target = end; break; }
    }
    if (target == null && clock > data[0].time) target = data[0].time;
  }
  if (target == null) return;
  app.replay.clockTime = target;
  app.replay.pinnedClock = null;
  syncReplayBarIndexFromClock();
  syncReplayFineIndexFromClock();
  renderReplayFrame();
  persistReplayForSymbol(app.symbol, app.wlSection);
}
document.getElementById("btnStepFwd").onclick = () => {
  if (app.switching) return;
  if (app.replay.active && app.fullData.length && replayModeControl.value === "bar") { stepChartBar(1); return; }
  if (!app.replay.active || !app.fullData.length) return;
  const fine = fineSeries();
  // Path A: lower-TF data covers this region → step one lower bar (progressive ghost OHLC)
  if (stepSeriesCoversClock(app.replay.clockTime) &&
      app.replay.fineIndex >= 0 && fine.length &&
      app.replay.fineIndex < fine.length - 1) {
    const next = app.replay.fineIndex + 1;
    if (fine[next].time >= app.replay.clockTime) {
      app.replay.fineIndex = next;
      app.replay.clockTime = fine[next].time;
      syncReplayBarIndexFromClock();
      renderReplayFrame();
      persistReplayForSymbol(app.symbol, app.wlSection);
      return;
    }
    syncReplayFineIndexFromClock();
  }
  // Path B: no lower coverage (older dates) → step one bar on the ACTIVE timeframe
  // Keep the new bar as developing (faded) by landing on its open
  let nextBar = app.replay.barIndex + 1;
  // If barIndex points at the currently-open developing bar, advance past it
  if (nextBar < app.fullData.length &&
      app.fullData[app.replay.barIndex] &&
      app.fullData[app.replay.barIndex].time <= app.replay.clockTime &&
      candleEndTime(app.fullData[app.replay.barIndex], app.tf.key, app.fullData, app.replay.barIndex) > app.replay.clockTime) {
    // currently sitting inside barIndex's period — next step completes it and opens next
    nextBar = app.replay.barIndex + 1;
  }
  if (nextBar >= app.fullData.length) return;
  app.replay.barIndex = nextBar;
  app.replay.clockTime = app.fullData[nextBar].time;
  syncReplayFineIndexFromClock();
  renderReplayFrame();
  persistReplayForSymbol(app.symbol, app.wlSection);
};
document.getElementById("btnStepBack").onclick = () => {
  if (app.switching) return;
  if (app.replay.active && app.fullData.length && replayModeControl.value === "bar") { stepChartBar(-1); return; }
  if (!app.replay.active || !app.fullData.length) return;
  const fine = fineSeries();
  // Path A: step back on lower TF when covered
  if (stepSeriesCoversClock(app.replay.clockTime) &&
      app.replay.fineIndex > 0 && fine.length) {
    const prev = app.replay.fineIndex - 1;
    if (fine[prev].time <= app.replay.clockTime) {
      app.replay.fineIndex = prev;
      app.replay.clockTime = fine[prev].time;
      syncReplayBarIndexFromClock();
      renderReplayFrame();
      persistReplayForSymbol(app.symbol, app.wlSection);
      return;
    }
    syncReplayFineIndexFromClock();
  }
  // Path B: step back one bar on the active timeframe
  const prevBar = app.replay.barIndex - 1;
  if (prevBar < 0) return;
  app.replay.barIndex = prevBar;
  app.replay.clockTime = app.fullData[prevBar].time;
  syncReplayFineIndexFromClock();
  renderReplayFrame();
  persistReplayForSymbol(app.symbol, app.wlSection);
};

/** Force-reload data from disk: clear in-memory cache, re-discover files, reload current chart */
async function refreshDataFromDisk() {
  const btn = document.getElementById("btnRefreshData");
  if (btn) { btn.classList.add("spinning"); btn.textContent = "⟳ Refreshing…"; }
  try {
    try { await fetch("/__btt2__/sync?t=" + Date.now(), { cache: "no-store" }); } catch (_) {}
    try {
      if (window.caches) {
        const keys = await caches.keys();
        await Promise.all(keys.filter(k => k.includes("data")).map(k => caches.delete(k)));
      }
      navigator.serviceWorker?.controller?.postMessage({ type: "CLEAR_DATA_CACHE" });
    } catch (_) {}
    ++app.loadSeq;
    app.dataGeneration = (app.dataGeneration || 0) + 1;
    app.cache = {};
    app.cacheFull = {};
    app.inflight = {};
    for (const k of Object.keys(availableFiles)) delete availableFiles[k];
    await discoverDataFiles();
    await setSymbolTf(app.symbol, app.tf.key, { clockMode: "isolated" });
    LOG("refreshDataFromDisk: done");
  } catch (e) {
    LOG("refreshDataFromDisk failed", e.message);
    showHint("Refresh failed: " + e.message);
  } finally {
    if (btn) { btn.classList.remove("spinning"); btn.textContent = "⟳ Refresh Data"; }
  }
}

</script>

<script>
// Boot

// One-time consolidation. Retain original browser saves and legacy slots.
function migratePairSections(saved) {
  const flag='btt2_pair_sections_shared_v1';
  if(localStorage.getItem(flag)) return;
  const backup='btt2_pair_sections_before_merge_v1';
  if(!localStorage.getItem(backup)) localStorage.setItem(backup,JSON.stringify({
    drawings:localStorage.getItem(Store.KEY),session:localStorage.getItem(Session.KEY)
  }));
  for(const [key,shapes] of Object.entries(Store.bySymbol)) {
    if(!/^(section1|section2)\|/.test(key))continue;
    const target='pairs|'+key.slice(key.indexOf('|')+1);
    const dest=Store.bySymbol[target]||(Store.bySymbol[target]=[]);
    for(const shape of shapes) {
      if(!dest.some(s=>s.id===shape.id))dest.push({...JSON.parse(JSON.stringify(shape)),symbol:target,selected:false});
    }
  }
  const maps=app.replayBySection;
  maps.pairs=maps.pairs||{};
  for(const sec of ['section1','section2'])for(const [symbol,state] of Object.entries(maps[sec]||{})) {
    if(!maps.pairs[symbol] || (saved?.symbol===symbol && (saved.wlSection===sec || saved.wlSection===(sec==='section1'?1:2))))
      maps.pairs[symbol]=JSON.parse(JSON.stringify(state));
  }
  // Write directly so a quota error cannot be mistaken for a completed migration.
  localStorage.setItem(Store.KEY,JSON.stringify({bySymbol:Store.bySymbol,nextId:Store.nextId}));
  if(saved){saved.replayBySection=maps;localStorage.setItem(Session.KEY,JSON.stringify(saved));}
  localStorage.setItem(flag,'1');
}
function firstAvailableChart(files) {
  for (const name of Object.keys(files)) {
    const tfKey = TF_ORDER.find(key => name.endsWith('_' + key));
    if (tfKey) return {symbol:name.slice(0, -(tfKey.length + 1)), tfKey};
  }
  return null;
}
</script>

<script>
(async function boot() {
  Theme.apply(Theme.current, false);
  initChart();
  document.getElementById("btnRefreshData")?.addEventListener("click", refreshDataFromDisk);
  Interaction.setTool("cursor");
  Store.load(); // restore drawings from previous sessions (phone + PC)
  TemplateStore.load();
  WeekMarkers.load();
  await discoverDataFiles();
  buildWatchlist();
  buildTfButtons();

  // Restore last session (pair, TF, replay, chart view)
  const saved = Session.load();
  migratePairSections(saved);
  let startSymbol = "EURUSD", startTf = "15m";
  const keys = Object.keys(availableFiles);
  if (saved?.symbol) startSymbol = saved.symbol;
  else if (keys.length && !availableFiles["EURUSD_15m"]) {
    const first = firstAvailableChart(availableFiles);
    if (first) {
      startSymbol = first.symbol;
      startTf = first.tfKey;
    }
  }
  if (saved?.tfKey) startTf = saved.tfKey;

  app._restoringSession = true;
  try {
    const bootSection = saved?.wlSection || app.wlSection || "pairs";
    await setSymbolTf(startSymbol, startTf, {
      section: bootSection,
      clockMode: "isolated",
    });

    // Restore chart visible range if we were in live view
    if (saved?.visibleRange?.from != null && saved?.visibleRange?.to != null && !saved?.replay?.active) {
      try {
        app.chart.timeScale().setVisibleRange({
          from: saved.visibleRange.from,
          to: saved.visibleRange.to,
        });
      } catch (_) {}
    }

    // Restore replay position
    if (saved?.replay?.active && saved.replay.clockTime != null) {
      if (saved.replay.speedMs) {
        app.replay.speedMs = normalizeReplaySpeed(saved.replay.speedMs);
        const sel = document.getElementById("speedSel");
        if (sel) sel.value = String(app.replay.speedMs);
        updateReplayMenu();
      }
      if (saved.replay.visibleBars) app.replay.visibleBars = saved.replay.visibleBars;
      await startReplayAt(saved.replay.clockTime);
      // startReplayAt anchors to bar open of that day; force exact clock if needed
      if (Number.isFinite(saved.replay.clockTime)) {
        app.replay.clockTime = saved.replay.clockTime;
        syncReplayBarIndexFromClock();
        syncReplayFineIndexFromClock();
        renderReplayFrame({ forceMedium: true });
      }
    } else {
      document.getElementById("replayStatus").textContent = "Live view";
    }
  } catch (err) {
    document.getElementById("replayStatus").textContent = "No data — check data folder";
    showHint("Put CSV files in data\\ then refresh");
  }
  app._restoringSession = false;
  const observation=Observations.current();
  if(observation?.range?.from!=null) { try { app.chart.timeScale().setVisibleRange(observation.range); } catch(e){} }
  Session.save();
  ObjectTree.render();
  setTimeout(() => document.getElementById("splash")?.classList.add("done"), 220);
  LOG("boot complete");
  window.dispatchEvent(new Event('btt2-ready'));
})();
setTimeout(() => document.getElementById("splash")?.classList.add("done"), 8000);
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
